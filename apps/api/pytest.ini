[pytest]
DJANGO_SETTINGS_MODULE = scraper.settings
python_files = tests.py test_*.py *_tests.py
python_classes = Test* *TestCase
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --cov=jobs
    --cov-report=term-missing
    --cov-report=html
testpaths = jobs/tests

